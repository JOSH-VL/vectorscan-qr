{% extends 'base/layout.html' %}
{% block title %}Desactivar Usuario — VectorScan QR{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width: 500px;">
    <div class="card-body text-center">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
        <h5 class="mt-3">¿Desactivar a {{ usuario.nombre_completo }}?</h5>
        <p class="text-muted">El usuario <strong>{{ usuario.username }}</strong> será marcado como inactivo y no podrá acceder al sistema.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Desactivar</button>
        </form>
    </div>
</div>
{% endblock %}
