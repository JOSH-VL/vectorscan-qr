{% extends 'base/layout.html' %}
{% block title %}Editar Usuario — VectorScan QR{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-pencil-square"></i> Editar Usuario: {{ usuario.username }}</h4>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nombre de usuario</label>
                    <input type="text" class="form-control" value="{{ usuario.username }}" disabled>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nombre completo</label>
                    <input type="text" name="nombre_completo" class="form-control" value="{{ usuario.nombre_completo }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Rol</label>
                    <select name="rol" class="form-select" required>
                        {% for r in roles %}
                        <option value="{{ r.pk }}" {% if usuario.rol_id == r.pk %}selected{% endif %}>{{ r.get_nombre_display }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Actualizar</button>
        </form>
    </div>
</div>
{% endblock %}
