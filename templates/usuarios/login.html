{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — VectorScan QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="login-card bg-white p-5">
        <div class="text-center mb-4">
            <h3 class="text-primary fw-bold"><i class="bi bi-shield-check"></i> VectorScan QR</h3>
            <p class="text-muted small">Plataforma de Vigilancia Epidemiológica</p>
        </div>
        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} py-2 small">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Ingresar</button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">Centro de Salud — San Felipe, Retalhuleu<br>© 2026</p>
    </div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
