{% extends 'base/layout.html' %}
{% block title %}Crear Usuario — VectorScan QR{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-person-plus"></i> Crear Nuevo Usuario</h4>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nombre de usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nombre completo</label>
                    <input type="text" name="nombre_completo" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Rol</label>
                    <select name="rol" class="form-select" required>
                        <option value="">Seleccionar rol...</option>
                        {% for r in roles %}
                        <option value="{{ r.pk }}">{{ r.get_nombre_display }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
